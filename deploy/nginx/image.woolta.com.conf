# image.woolta.com — 업로드된 이미지·동영상 정적 서빙
#
# **백엔드를 거치지 않는다.** woolta-api 는 파일을 쓰기만 하고, 읽기는 nginx 가 디스크에서 직접 한다.
# 그래서 API 를 재시작해도 이미지 조회는 무중단이고, 반대로 이 디렉터리를
# API 서버가 쓸 수 있어야(IMAGE_UPLOAD_PATH 동일 경로) 새 업로드가 보인다.
#
# 기존 구성과 같은 형태다 — 경로를 바꾸지 않는 것이 중요하다.
# 744건의 기존 이미지 URL 이 이 호스트를 가리키고 있다.

server {
    listen 443 ssl http2;
    server_name image.woolta.com;

    # ssl_certificate     /etc/letsencrypt/live/image.woolta.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/image.woolta.com/privkey.pem;

    access_log /var/log/nginx/image.woolta.com.access.log;
    error_log  /var/log/nginx/image.woolta.com.error.log;

    root /home/blog/post/upload;

    # 업로드 파일명은 crypto 난수라 내용이 바뀌지 않는다 — 길게 캐시한다
    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # 다른 도메인의 <img> 에서 불러간다
        add_header Access-Control-Allow-Origin "*";
    }

    # 디렉터리 목록 노출 금지
    autoindex off;
}

server {
    listen 80;
    server_name image.woolta.com;
    return 301 https://$host$request_uri;
}

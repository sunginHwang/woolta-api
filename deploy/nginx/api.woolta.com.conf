# api.woolta.com — woolta-api (pm2: woolta-api, :4100)
#
# 포트 4100 인 이유: 레거시 Koa woolbankApi 가 4000 을 쓰고 있다.

server {
    listen 443 ssl http2;
    server_name api.woolta.com;

    # ssl_certificate     /etc/letsencrypt/live/api.woolta.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.woolta.com/privkey.pem;

    access_log /var/log/nginx/api.woolta.com.access.log;
    error_log  /var/log/nginx/api.woolta.com.error.log;

    # 이미지·동영상 업로드가 이 호스트로 들어온다. 기본 1m 이면 사진 한 장에 413 이 난다.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4100;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 세션 쿠키가 .woolta.com 공유라 그대로 흘려보낸다
        proxy_pass_request_headers on;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    server_name api.woolta.com;
    return 301 https://$host$request_uri;
}

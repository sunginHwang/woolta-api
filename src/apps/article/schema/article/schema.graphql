type Query
type Mutation
scalar DateTime

type ArticleCategory {
  id: String!
  name: String!
  order: Int!
  createdAt: DateTime!
}

type ArticleCategoryList {
  totalCount: Int!
  itemList: [ArticleCategory!]!
}

type ArticleSeo {
  title: String
  description: String
  imageUrl: String
}

input ArticleSeoInput {
  title: String
  description: String
  imageUrl: String
}

type Article {
  id: String!
  categoryId: String! # 아티클은 반드시 카테고리 소속 (기본함 없음)
  title: String!
  url: String!
  seo: ArticleSeo
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ArticleList {
  totalCount: Int!
  itemList: [Article!]!
}

type WeeklyCuration {
  weekKey: String! # ISO 주차 키, 예: 2026-W34
  articleIds: [String!]! # 최대 5개 (WEEKLY_CURATION_LIMIT)
  articles: [Article!]! # 임베드 (스펙 ?expand=articles 대응)
}

type WeeklyCurationList {
  totalCount: Int!
  itemList: [WeeklyCuration!]!
}

input CreateArticleInput {
  categoryId: String!
  title: String!
  url: String!
  seo: ArticleSeoInput
}

input UpdateArticleInput {
  id: String!
  title: String
  url: String
  categoryId: String
  seo: ArticleSeoInput
}

input DeleteArticleInput {
  id: String!
}

input CreateArticleCategoryInput {
  name: String!
}

input UpdateArticleCategoryInput {
  id: String!
  name: String!
}

input DeleteArticleCategoryInput {
  id: String!
}

input AddArticleToCurationInput {
  weekKey: String!
  articleId: String!
}

input RemoveArticleFromCurationInput {
  weekKey: String!
  articleId: String!
}

input ImportArticleCategoryInput {
  clientId: String!
  name: String!
  order: Int!
  createdAt: DateTime
}

input ImportArticleInput {
  clientId: String!
  categoryClientId: String!
  title: String!
  url: String!
  seo: ArticleSeoInput
  createdAt: DateTime
  updatedAt: DateTime
}

input ImportCurationInput {
  weekKey: String!
  articleClientIds: [String!]!
}

input ImportArticleListInput {
  categoryList: [ImportArticleCategoryInput!]!
  itemList: [ImportArticleInput!]!
  curationList: [ImportCurationInput!]!
}

type ArticleIdMapping {
  from: String!
  to: String!
}

type ArticleImportResult {
  categoryIdMap: [ArticleIdMapping!]!
  articleIdMap: [ArticleIdMapping!]!
}

extend type Query {
  articleCategoryList: ArticleCategoryList! # order ASC
  articleList(categoryId: String): ArticleList! # 생략 시 전체, createdAt DESC
  weeklyCurationList: WeeklyCurationList! # 전체 주차 (주차 수 적음)
}

extend type Mutation {
  createArticleCategory(input: CreateArticleCategoryInput!): ArticleCategory!
  updateArticleCategory(input: UpdateArticleCategoryInput!): ArticleCategory!
  # 캐스케이드: 소속 아티클 전체 삭제 + 그 아티클들의 큐레이션 행 제거 (이동 아님, 삭제)
  deleteArticleCategory(input: DeleteArticleCategoryInput!): Boolean!
  # 정규화 URL 기준 유저 내 중복 시 CONFLICT
  createArticle(input: CreateArticleInput!): Article!
  updateArticle(input: UpdateArticleInput!): Article!
  # 캐스케이드: 모든 주차 큐레이션에서 해당 articleId 제거
  deleteArticle(input: DeleteArticleInput!): Boolean!
  # 주차당 최대 5개 초과 시 CONFLICT, 이미 있으면 멱등 반환
  addArticleToCuration(input: AddArticleToCurationInput!): WeeklyCuration!
  removeArticleFromCuration(input: RemoveArticleFromCurationInput!): WeeklyCuration!
  importArticleList(input: ImportArticleListInput!): ArticleImportResult!
}

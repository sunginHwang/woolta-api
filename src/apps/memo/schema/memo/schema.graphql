type Query
type Mutation
scalar DateTime
scalar JSON

type Memo {
  id: String!
  title: String!
  content: JSON! # Tiptap document JSON — opaque
  createdAt: DateTime!
  updatedAt: DateTime!
}

# 목록은 content 제외 (본문이 커질 수 있음 — 스펙 권장)
type MemoSummary {
  id: String!
  title: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type MemoList {
  totalCount: Int!
  itemList: [MemoSummary!]!
}

input UpdateMemoInput {
  id: String!
  title: String
  content: JSON
}

input DeleteMemoInput {
  id: String!
}

input ImportMemoInput {
  clientId: String!
  title: String!
  content: JSON!
  createdAt: DateTime
  updatedAt: DateTime
}

input ImportMemoListInput {
  itemList: [ImportMemoInput!]!
}

type MemoIdMapping {
  from: String!
  to: String!
}

type MemoImportResult {
  memoIdMap: [MemoIdMapping!]!
}

extend type Query {
  memoList: MemoList! # updatedAt DESC
  memo(id: String!): Memo # 없으면 null 반환
}

extend type Mutation {
  # 인자 없음 — "새 메모" 클릭 즉시 빈 메모 생성 (title '', content 빈 doc)
  createMemo: Memo!
  updateMemo(input: UpdateMemoInput!): Memo!
  deleteMemo(input: DeleteMemoInput!): Boolean! # 휴지통 없음, 즉시 영구 삭제
  importMemoList(input: ImportMemoListInput!): MemoImportResult!
}

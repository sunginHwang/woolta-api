type Query
type Mutation
scalar DateTime

# 원본 woolbankApi SocialType: 'kakaoTalk' | 'facebook' | 'google'
# GraphQL 경계에서만 UPPER_CASE 사용; DB/JWT는 기존 소문자/camel 값 유지
enum SocialLoginType {
  FACEBOOK
  KAKAO_TALK
  GOOGLE
}

type UserInfo {
  id: Int!
  name: String!
  email: String!
  loginType: String!
  socialId: String!
  profileImg: String!
  authType: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

input LoginBySocialInput {
  loginType: SocialLoginType!
  """
  provider가 발급한 토큰. GOOGLE = id_token, KAKAO_TALK / FACEBOOK = access token.
  서버가 provider에 되물어 검증하며, 여기서 확인된 식별자만 socialId로 쓴다.
  """
  token: String!
  # 아래는 표시용 프로필 보조값 — 신원 판단에는 사용하지 않는다.
  name: String
  email: String
  imageUrl: String
}

input LoginByShareCodeInput {
  shareCode: String!
}

extend type Query {
  me: UserInfo!
  checkAccess: Int!
  getShareCode: String!
}

extend type Mutation {
  loginBySocial(input: LoginBySocialInput!): UserInfo!
  loginByShareCode(input: LoginByShareCodeInput!): UserInfo!
  logout: Boolean!
  """
  refresh 쿠키로 세션 갱신(회전). 토큰 값은 인자로도 응답으로도 오가지 않고 쿠키로만 처리된다.
  """
  refreshSession: Boolean!
  upsertShareCode: String!
}

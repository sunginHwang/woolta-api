type Query
type Mutation
scalar DateTime

# 원본 woolbankApi SocialType: 'kakaoTalk' | 'facebook' | 'google'
# GraphQL 경계에서만 UPPER_CASE 사용; DB/JWT는 기존 소문자/camel 값 유지
enum SocialLoginType {
  FACEBOOK
  KAKAO_TALK
  GOOGLE
}

type UserInfo {
  id: Int!
  name: String!
  email: String!
  loginType: String!
  socialId: String!
  profileImg: String!
  authType: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type AuthTokens {
  accessToken: String!
  refreshToken: String!
}

type LoginResult {
  user: UserInfo!
  accessToken: String!
  refreshToken: String!
}

type CheckTokenResult {
  userInfo: UserInfo!
  authTokens: AuthTokens!
}

input LoginBySocialInput {
  name: String
  email: String
  imageUrl: String!
  loginType: SocialLoginType!
  socialId: String!
}

input LoginByShareCodeInput {
  shareCode: String!
}

input CheckRefreshTokenInput {
  refreshToken: String!
}

extend type Query {
  me: UserInfo!
  checkAccess: Int!
  checkToken: CheckTokenResult!
  getShareCode: String!
}

extend type Mutation {
  loginBySocial(input: LoginBySocialInput!): LoginResult!
  loginByShareCode(input: LoginByShareCodeInput!): LoginResult!
  logout: Boolean!
  checkRefreshToken(input: CheckRefreshTokenInput!): AuthTokens!
  upsertShareCode: String!
}

type Query
type Mutation
scalar DateTime

enum TodoPriority {
  NONE
  LOW
  MEDIUM
  HIGH
}

type Todo {
  id: String!
  title: String!
  memo: String!
  dueDate: String # YYYY-MM-DD (date-only)
  categoryId: String # null = 기본함(inbox)
  priority: TodoPriority!
  isCompleted: Boolean!
  completedAt: DateTime
  deletedAt: DateTime # soft delete (휴지통)
  order: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type TodoList {
  totalCount: Int!
  itemList: [Todo!]!
}

type TodoCategory {
  id: String!
  name: String!
  order: Int!
  createdAt: DateTime!
}

type TodoCategoryList {
  totalCount: Int!
  itemList: [TodoCategory!]!
}

input CreateTodoInput {
  title: String!
  dueDate: String
  categoryId: String
  priority: TodoPriority
}

input UpdateTodoInput {
  id: String!
  title: String
  memo: String
  dueDate: String
  categoryId: String
  priority: TodoPriority
}

input CompleteTodoInput {
  id: String!
  isCompleted: Boolean!
}

input TrashTodoInput {
  id: String!
}

input RestoreTodoInput {
  id: String!
}

input DeleteTodoInput {
  id: String!
}

input CreateTodoCategoryInput {
  name: String!
}

input UpdateTodoCategoryInput {
  id: String!
  name: String!
}

input DeleteTodoCategoryInput {
  id: String!
}

# 로컬스토리지 1회 이관용 — clientId(로컬 uuid) 기준으로 서버 id 매핑 반환
input ImportTodoCategoryInput {
  clientId: String!
  name: String!
  order: Int!
  createdAt: DateTime
}

input ImportTodoInput {
  clientId: String!
  title: String!
  memo: String!
  dueDate: String
  categoryClientId: String
  priority: TodoPriority!
  isCompleted: Boolean!
  completedAt: DateTime
  deletedAt: DateTime
  order: Int!
  createdAt: DateTime
  updatedAt: DateTime
}

input ImportTodoListInput {
  categoryList: [ImportTodoCategoryInput!]!
  itemList: [ImportTodoInput!]!
}

type IdMapping {
  from: String!
  to: String!
}

type TodoImportResult {
  categoryIdMap: [IdMapping!]!
  todoIdMap: [IdMapping!]!
}

extend type Query {
  # v1: 휴지통 포함 전체 1회 조회 — 스마트 리스트 필터/카운트는 클라이언트 유지 (스펙 허용안)
  todoList: TodoList!
  todoCategoryList: TodoCategoryList!
}

extend type Mutation {
  createTodo(input: CreateTodoInput!): Todo!
  updateTodo(input: UpdateTodoInput!): Todo!
  # 토글이 아닌 명시값 (동시성 안전) — 서버가 completedAt 세팅/해제
  completeTodo(input: CompleteTodoInput!): Todo!
  trashTodo(input: TrashTodoInput!): Todo!
  restoreTodo(input: RestoreTodoInput!): Todo!
  deleteTodo(input: DeleteTodoInput!): Boolean!
  emptyTrash: Boolean!
  createTodoCategory(input: CreateTodoCategoryInput!): TodoCategory!
  updateTodoCategory(input: UpdateTodoCategoryInput!): TodoCategory!
  # 캐스케이드: 소속 todo 는 categoryId = null (기본함 이동)
  deleteTodoCategory(input: DeleteTodoCategoryInput!): Boolean!
  importTodoList(input: ImportTodoListInput!): TodoImportResult!
}
